workflows:
  ios-appstore:
    name: Dealers Tycoon iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic の Team settings > Integrations で登録した App Store Connect APIキーの名前
      app_store_connect: DealersTycoon ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dealerstycoon.app
      vars:
        APP_STORE_APPLE_ID: 6825392159
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    scripts:
      - name: Unpack project
        script: |
          unzip -q -o project.zip -d .
          ls
      - name: Install npm packages
        script: |
          npm ci || npm install
      - name: Capacitor sync (copy game into iOS project)
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          cd ios/App && agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
